<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial;
        }

        ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ol.menu > li {
            display: inline-block;
            background: #ff2f8b;
            color: white;
            padding: 10px 20px;
            margin-right: 10px;
            position: relative;
            cursor: pointer;
            text-decoration: underline; 
            width: 135px;
        }

        ol.submenu {
            position: absolute;
            top: 40px;
            left: 0;
            background: white;
            border: 2px solid #ff2f8b;
            padding: 10px;
            width: 150px;
        }

        ol.submenu li {
            color: black;
            padding: 5px 0;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<ol class="menu">
    <li class="item">
        jQuery
        <ol class="submenu">
            <li>Download</li>
            <li>Documentation</li>
            <li>Blog</li>
        </ol>
    </li>

    <li class="item">
        Community
        <ol class="submenu">
            <li>Mailing List</li>
            <li>Tutorials</li>
            <li>Demos</li>
            <li>Plugins</li>
        </ol>
    </li>

    <li class="item">
        Development
        <ol class="submenu">
            <li>Source Code</li>
            <li>Bug Tracking</li>
            <li>Recent Changes</li>
        </ol>
    </li>
</ol>

<script>
$(document).ready(function(){

    $("li.item ol").hide();

    $("li.item").hover(
        function(){ 
            $("li.item ol").hide();
            $(this).children("ol").show();
        },
        function(){ 
            $(this).children("ol").hide();
        }
    );

});
</script>

</body>
</html>
